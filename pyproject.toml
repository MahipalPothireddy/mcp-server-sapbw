[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-sapbw"
version = "0.1.0"
description = "SAP BW technical-discovery MCP - a read-only, system-agnostic MCP server exposing SAP BW-on-HANA metadata as model-callable tools, resources, and prompts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "mcp-server-sapbw contributors" }]
keywords = ["mcp", "sap", "bw", "bw4hana", "hana", "metadata", "lineage", "model-context-protocol"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

# Core runtime dependencies.
# FastMCP is pinned exactly per mission Section 10 (3.x changed the auth model from 2.x;
# verified against the v3.4.4 docs). Other deps use conservative bounded ranges.
dependencies = [
    "fastmcp==3.4.4",
    "hdbcli>=2.19,<3",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
# Diagram rasterisation. SVG rendering is built in and needs nothing; this extra only adds PNG
# output for MCP clients that render raster images but not SVG. Pillow draws locally - no diagram
# content ever leaves the machine (a hosted renderer would exfiltrate customer object names).
viz = [
    "pillow>=10.4,<12",
]

# Reading extractor-exit ABAP from a source system over ADT (SAP's own HTTP source service).
# Optional because it targets a second system with separate credentials: a BW-only install never
# needs it, and httpx is imported lazily so its absence costs nothing until the connector is used.
ecc = [
    "httpx>=0.27,<0.29",
]

# NOTE: mission Section 10 lists an optional "pyrfc" extra for RFC-based query resolution.
# It is intentionally NOT declared here: SAP PyRFC is no longer supported and every
# pyrfc>=2.5 release is yanked on PyPI (see https://github.com/SAP/PyRFC/issues/372), which
# makes the extra unsatisfiable and pulls in a yanked dependency. The core metadata path is
# SQL-only via hdbcli and does not require it. If RFC-based resolution is added later, install
# pyrfc out-of-band against a compatible SAP NW RFC SDK rather than pinning a yanked release.
#
# Development + CI toolchain. Everything here runs offline.
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "detect-secrets>=1.5",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/MahipalPothireddy/mcp-server-sapbw"
Repository = "https://github.com/MahipalPothireddy/mcp-server-sapbw"
Changelog = "https://github.com/MahipalPothireddy/mcp-server-sapbw/blob/main/CHANGELOG.md"

[project.scripts]
# Console entry point used by the Kiro MCP registration:
#   uvx --from mcp-server-sapbw mcp-server-sapbw
# The real FastMCP bootstrap lands in B3; until then main() is an honest stub.
mcp-server-sapbw = "mcp_server_sapbw.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_sapbw"]

[tool.hatch.build.targets.sdist]
include = ["src/mcp_server_sapbw", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# A pragmatic, non-noisy rule set. Expand as the codebase grows.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PL", "RUF"]
ignore = [
    "PLR0913", # many arguments is common for metadata record builders
]

[tool.ruff.lint.per-file-ignores]
# Magic values are fine in test assertions; dispatch-style test helpers (fixture
# query routers) may have many returns and branches.
"tests/**" = ["PLR2004", "PLR0911", "PLR0912"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Third-party packages without (complete) type information for our usage.
module = ["hdbcli.*", "fastmcp.*", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
source = ["mcp_server_sapbw"]
branch = true
