# Example connection profiles for mcp-server-sapbw.
#
# Copy this file to `profiles.yaml` (git-ignored) and fill in per-system values.
# Secrets are NEVER written here as literals — reference environment variables with
# ${VAR} interpolation and set those in your shell or `.env` (also git-ignored).
#
# Every tool/resource/prompt takes a `system:` argument naming one of these profiles.
# The server is stateless across calls; connections are pooled per profile.

systems:
  dev:
    host: ${BW_DEV_HOST}
    port: 30015                 # HANA SQL port, e.g. 3<instance>15
    user: ${BW_DEV_USER}
    password: ${BW_DEV_PASSWORD}
    abap_schema: auto           # resolve at connect; do NOT hardcode SAPABAP1
    encrypt: true
    read_only_user: true        # assert no write grants; fail closed if any are found

  qa:
    host: ${BW_QA_HOST}
    port: 30015
    user: ${BW_QA_USER}
    password: ${BW_QA_PASSWORD}
    abap_schema: auto
    encrypt: true
    read_only_user: true

  prd:
    host: ${BW_PRD_HOST}
    port: 30015
    user: ${BW_PRD_USER}
    password: ${BW_PRD_PASSWORD}
    abap_schema: auto
    encrypt: true
    # TLS certificate handling (optional; only when encrypt: true). Validation defaults to true.
    # For internal/self-signed HANA certs, either point at the CA:
    #   ssl_trust_store: /path/to/internal-ca.pem
    # or, for non-production only, disable chain validation (channel stays encrypted):
    #   ssl_validate_certificate: false
    read_only_user: true

    # --- optional operational settings (shown here with their defaults) ---------------------
    #
    # Ceiling on concurrent connections for this system. MCP tool calls run in a worker
    # threadpool, so simultaneous calls need separate sessions. Growth is lazy: one analyst
    # working sequentially only ever opens one. Lower it to 1 where sessions per user are
    # restricted; raise it for a shared install.
    #   pool_size: 4
    #
    # Fail fast instead of hanging a tool call on an unreachable host.
    #   connect_timeout_seconds: 30
    #
    # Driver-level inactivity bound. Best-effort (it depends on driver and server behaviour);
    # the per-call query budget is the actual guarantee. 0 disables it.
    #   communication_timeout_seconds: 0
    #
    # Statements slower than this are logged at WARNING regardless of log level.
    #   slow_query_ms: 5000
    #
    # Whether extracted metadata may be cached on local disk. Structural extracts include ABAP
    # routine source and query definitions - customer IP at rest. Set false to keep nothing on
    # disk, at the cost of re-reading on every call. See SECURITY.md and bw_cache_status.
    #   cache_enabled: true

# OPTIONAL: ABAP source systems, reached over ADT (SAP's own HTTP source service).
#
# Only needed to read extractor-exit ABAP, which exists in the source system and not in BW.
# Omit this block entirely and the ECC-gated analysis reports "connector not configured"
# instead of guessing. The connection is GET-only and takes no ADT locks.
#
# ecc_systems:
#   eq3:
#     host: ${ECC_EQ3_HOST}
#     port: 44300               # ICM HTTPS port, e.g. 443<instance>
#     client: "300"             # sap-client; a wrong client silently reads other code
#     user: ${ECC_EQ3_USER}
#     password: ${ECC_EQ3_PASSWORD}
#     use_tls: true             # leave true: Basic auth over plain HTTP exposes the password
#     ssl_validate_certificate: true
#     timeout_seconds: 30
#     # For an internal-only system with no TLS listener, plain HTTP needs a second,
#     # deliberate opt-in - use_tls: false alone is rejected:
#     #   use_tls: false
#     #   allow_plain_http: true
#
# Requires the optional extra:  pip install 'mcp-server-sapbw[ecc]'
# The ADT user needs source-display authorisation and an active ADT ICF node.

# OPTIONAL: your BI platform's reporting inventory, for scenarios 9.7 and 9.8.
#
# Report schedules and dashboard sources are not in BW, so those two analyses need them from
# outside. This takes an exported FILE rather than platform credentials - which means it works for
# any platform (Tableau, Power BI, SAP Analytics Cloud, Looker, Qlik, BOBJ), the export is
# auditable, and this server keeps its "read-only, BW only" trust boundary.
#
# bi_systems:
#   inventory_path: ${BI_INVENTORY_PATH}     # a local .yaml or .json file
#
# Inventory format (unknown keys are ignored, so a raw export usually works as-is):
#
#   platform: Power BI               # free text; findings name it as the source
#   reports:
#     - name: Daily Sales Extract
#       provider: SALES_DSO          # the BW provider the report reads
#       scheduled_start: "06:10"     # local wall clock, 24h
#       frequency: daily             # optional
#       owner: someone               # optional
#   dashboards:
#     - name: Margin Dashboard
#       source_object: PKG/SALES_CV  # a calc view, or a BW provider
#       source_kind: calc_view       # calc_view | bw_provider
#
# With this configured, 9.7 computes a safety margin per report (its scheduled start vs the p95
# completion of the chain feeding its provider) and 9.8 classifies each dashboard's calc view as
# shared with a CompositeProvider (one change breaks both paths) or separate (the two can silently
# diverge). Without it, both report exactly what they need instead of guessing.

# Notes:
# - Capability discovery (release, ABAP schema, object-model variants, log-retention
#   window) runs on first connect and is cached per profile.
# - Runtime statistics (RSPCPROCESSLOG chain runtimes, RSDDSTAT* query usage) are only
#   meaningful in PRD; non-production values for those are not representative.
# - Do not commit `profiles.yaml`. It is git-ignored for a reason.
