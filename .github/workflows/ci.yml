name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: lint + type + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy src tests

      - name: Pytest (offline only)
        run: pytest

  capability-contract:
    name: capability contract (no undeclared drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Fails when a declared capability has neither a reader nor a stated intent, and when
      # docs/capability-contract.md no longer matches what the code declares. Runs the suite
      # itself, with read recording on, so capabilities reached through a variable are counted
      # rather than reported as dead by a grep. Offline, like every other check here.
      - name: Contract check
        run: python scripts/capability_contract.py --check

  security:
    name: secret scan + customer-metadata leak check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the leak check can scan every commit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: |
          python -m pip install --upgrade pip
          pip install "detect-secrets>=1.5"

      # Secret scanning. Example/template files use placeholders and ${VAR} references
      # only, so they are excluded to avoid false positives on documented placeholders.
      # No --all-files: scan git-tracked files only, so git-ignored caches/venv/extracts
      # are never scanned (avoids false positives on tool cache signatures).
      - name: Secret scan (detect-secrets)
        run: |
          detect-secrets scan \
            --exclude-files '(\.env\.example|profiles\.example\.yaml|\.secrets\.report\.json)$' \
            > .secrets.report.json
          python - <<'PY'
          import json, sys
          with open(".secrets.report.json") as fh:
              report = json.load(fh)
          results = report.get("results", {})
          if results:
              print("Potential secrets detected in:")
              for path in results:
                  print(f"  - {path}")
              sys.exit(1)
          print("Secret scan clean.")
          PY

      # Customer-metadata leak check (mission Section 10): a single committed, cross-platform
      # script is the source of truth (no CI/local drift). It scans the working tree AND full git
      # history for /BIC//BI0/ generated tables and Z*/Y* customer-namespace tokens outside
      # tests/fixtures/, with a documented allow-list of non-customer placeholders. Needs the full
      # history (fetch-depth: 0, set on this job's checkout).
      - name: Customer-metadata leak check (working tree + full history)
        run: python scripts/customer_metadata_scan.py
